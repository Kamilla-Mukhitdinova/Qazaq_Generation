services:
  - type: web
    name: qazaq-generation-api-frankfurt
    runtime: node
    rootDir: server
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: qazaq-generation-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://qazaq-generation.vercel.app
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@qazaq-generation.kz

databases:
  - name: qazaq-generation-db
    databaseName: qazaq_generation
    plan: free
    ipAllowList: []
